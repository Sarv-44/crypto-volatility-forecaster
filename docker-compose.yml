version: '3.8'

services:
  crypto-forecaster:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto_volatility_forecaster
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=production
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./models/saved:/app/models/saved
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
